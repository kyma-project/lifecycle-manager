<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1940 476" width="1940" height="476"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
     text-rendering="geometricPrecision">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0b0b0b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c7a75"/>
    </marker>
    <marker id="arrowSync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a3aa7"/>
    </marker>
  </defs>

  <!-- page -->
  <rect x="0" y="0" width="1940" height="476" fill="#fbfbf9"/>

  <!-- title -->
  <text x="48" y="42" font-size="20" font-weight="600" fill="#0b0b0b" letter-spacing="-0.01em">Runtime Watcher PKI: Certificate &amp; Secret Flow (KCP &#8594; SKR)</text>
  <text x="48" y="64" font-size="13" font-weight="400" fill="#52514e">Target names per ADR 009. Issuers sign Certificates, which materialize Secrets; the client certificate and CA bundle sync to the runtime and are mounted by the runtime agent.</text>

  <!-- cluster containers -->
  <rect x="32" y="96" width="1562" height="288" rx="12" fill="#f4f4f2" stroke="#e1e0d9" stroke-width="1"/>
  <text x="48" y="120" font-size="12" font-weight="700" fill="#898781" letter-spacing="0.06em">KYMA CONTROL PLANE (KCP)</text>

  <rect x="1622" y="96" width="282" height="288" rx="12" fill="#f4f4f2" stroke="#e1e0d9" stroke-width="1"/>
  <text x="1638" y="120" font-size="12" font-weight="700" fill="#898781" letter-spacing="0.06em">KYMA RUNTIME (SKR)</text>

  <!-- ============ EDGES (drawn under cards) ============ -->
  <!-- E1 CA-Issuer -> CA-Cert : issues -->
  <path d="M298,188 H368" fill="none" stroke="#7c7a75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="333" y="180" font-size="11" font-weight="500" text-anchor="middle" stroke="#fbfbf9" stroke-width="3" paint-order="stroke">issues</text>
  <text x="333" y="180" font-size="11" font-weight="500" text-anchor="middle" fill="#52514e">issues</text>

  <!-- E2 CA-Cert -> CA-Secret : stores -->
  <path d="M618,188 H688" fill="none" stroke="#7c7a75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="653" y="180" font-size="11" font-weight="500" text-anchor="middle" stroke="#fbfbf9" stroke-width="3" paint-order="stroke">stores</text>
  <text x="653" y="180" font-size="11" font-weight="500" text-anchor="middle" fill="#52514e">stores</text>

  <!-- E3 Client-Issuer -> CA-Secret : reads CA (reference, dotted) -->
  <path d="M813,312 V220" fill="none" stroke="#7c7a75" stroke-width="1.5" stroke-dasharray="1.5 3" marker-end="url(#arrow)"/>
  <text x="825" y="270" font-size="11" font-weight="500" text-anchor="start" stroke="#fbfbf9" stroke-width="3" paint-order="stroke">uses CA certificate for signing</text>
  <text x="825" y="270" font-size="11" font-weight="500" text-anchor="start" fill="#52514e">uses CA certificate for signing</text>

  <!-- E4 CA-Secret -> Gateway Secret : server cert + CA bundle (label lifted above box row) -->
  <path d="M938,188 H1008" fill="none" stroke="#7c7a75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="973" y="138" font-size="11" font-weight="500" text-anchor="middle" stroke="#fbfbf9" stroke-width="3" paint-order="stroke"><tspan x="973" dy="0">copies certificate,</tspan><tspan x="973" dy="13">private key, CA bundle</tspan></text>
  <text x="973" y="138" font-size="11" font-weight="500" text-anchor="middle" fill="#52514e"><tspan x="973" dy="0">copies certificate,</tspan><tspan x="973" dy="13">private key, CA bundle</tspan></text>

  <!-- E5 Client-Issuer -> Client-Cert : issues -->
  <path d="M938,344 H1008" fill="none" stroke="#7c7a75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="973" y="336" font-size="11" font-weight="500" text-anchor="middle" stroke="#fbfbf9" stroke-width="3" paint-order="stroke">issues</text>
  <text x="973" y="336" font-size="11" font-weight="500" text-anchor="middle" fill="#52514e">issues</text>

  <!-- E6 Client-Cert -> Client-Secret : stores -->
  <path d="M1258,344 H1328" fill="none" stroke="#7c7a75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1293" y="336" font-size="11" font-weight="500" text-anchor="middle" stroke="#fbfbf9" stroke-width="3" paint-order="stroke">stores</text>
  <text x="1293" y="336" font-size="11" font-weight="500" text-anchor="middle" fill="#52514e">stores</text>

  <!-- E8 Gateway Secret -> RW-Secret : sync CA bundle (dashed, cross-cluster) -->
  <path d="M1258,188 H1638" fill="none" stroke="#4a3aa7" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowSync)"/>
  <text x="1448" y="180" font-size="11" font-weight="500" text-anchor="middle" stroke="#fbfbf9" stroke-width="3" paint-order="stroke">sync CA bundle</text>
  <text x="1448" y="180" font-size="11" font-weight="500" text-anchor="middle" fill="#4a3aa7">sync CA bundle</text>

  <!-- E7 Client-Secret -> RW-Secret : sync client cert (dashed, cross-cluster, elbow) -->
  <path d="M1578,344 H1608 V204 H1638" fill="none" stroke="#4a3aa7" stroke-width="1.6" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrowSync)"/>
  <text x="1490" y="300" font-size="11" font-weight="500" text-anchor="middle" stroke="#fbfbf9" stroke-width="3" paint-order="stroke">sync certificate, private key</text>
  <text x="1490" y="300" font-size="11" font-weight="500" text-anchor="middle" fill="#4a3aa7">sync certificate, private key</text>

  <!-- E9 RW-Secret -> RW-Deploy : mounts -->
  <path d="M1763,220 V312" fill="none" stroke="#7c7a75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1775" y="270" font-size="11" font-weight="500" text-anchor="start" stroke="#fbfbf9" stroke-width="3" paint-order="stroke">mounts</text>
  <text x="1775" y="270" font-size="11" font-weight="500" text-anchor="start" fill="#52514e">mounts</text>

  <!-- ============ NODES ============ -->
  <!-- 1 CA-Issuer -->
  <g transform="translate(48,156)" filter="url(#cardShadow)">
    <rect width="250" height="64" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
    <rect x="100" y="10" width="50" height="15" rx="7.5" fill="#2a78d6"/>
    <text x="125" y="21.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">ISSUER</text>
    <text x="125" y="45" font-size="12.5" font-weight="600" fill="#12385f" text-anchor="middle">klm-runtime-watcher-ca</text>
  </g>
  <!-- 2 CA-Cert -->
  <g transform="translate(368,156)" filter="url(#cardShadow)">
    <rect width="250" height="64" rx="10" fill="#fdeee6" stroke="#eb6834" stroke-width="2"/>
    <rect x="84.5" y="10" width="81" height="15" rx="7.5" fill="#b0491c"/>
    <text x="125" y="21.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">CERTIFICATE</text>
    <text x="125" y="45" font-size="12.5" font-weight="600" fill="#7a3111" text-anchor="middle">klm-runtime-watcher-ca</text>
  </g>
  <!-- 3 CA-Secret -->
  <g transform="translate(688,156)" filter="url(#cardShadow)">
    <rect width="250" height="64" rx="10" fill="#e6f6f0" stroke="#1baf7a" stroke-width="2"/>
    <rect x="100" y="10" width="50" height="15" rx="7.5" fill="#0f6b4b"/>
    <text x="125" y="21.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">SECRET</text>
    <text x="125" y="45" font-size="12.5" font-weight="600" fill="#0d5540" text-anchor="middle">klm-runtime-watcher-ca</text>
  </g>
  <!-- 4 Gateway Secret -->
  <g transform="translate(1008,156)" filter="url(#cardShadow)">
    <rect width="250" height="64" rx="10" fill="#e6f6f0" stroke="#1baf7a" stroke-width="2"/>
    <rect x="100" y="10" width="50" height="15" rx="7.5" fill="#0f6b4b"/>
    <text x="125" y="21.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">SECRET</text>
    <text x="125" y="45" font-size="12.5" font-weight="600" fill="#0d5540" text-anchor="middle">klm-runtime-watcher-server</text>
  </g>
  <!-- 5 Client-Issuer -->
  <g transform="translate(688,312)" filter="url(#cardShadow)">
    <rect width="250" height="64" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
    <rect x="100" y="10" width="50" height="15" rx="7.5" fill="#2a78d6"/>
    <text x="125" y="21.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">ISSUER</text>
    <text x="125" y="45" font-size="12.5" font-weight="600" fill="#12385f" text-anchor="middle">klm-runtime-watcher-client</text>
  </g>
  <!-- 6 Client-Cert -->
  <g transform="translate(1008,312)" filter="url(#cardShadow)">
    <rect width="250" height="64" rx="10" fill="#fdeee6" stroke="#eb6834" stroke-width="2"/>
    <rect x="84.5" y="10" width="81" height="15" rx="7.5" fill="#b0491c"/>
    <text x="125" y="21.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">CERTIFICATE</text>
    <text x="125" y="45" font-size="11" font-weight="600" fill="#7a3111" text-anchor="middle">klm-{KYMA_NAME}-runtime-watcher-client</text>
  </g>
  <!-- 7 Client-Secret -->
  <g transform="translate(1328,312)" filter="url(#cardShadow)">
    <rect width="250" height="64" rx="10" fill="#e6f6f0" stroke="#1baf7a" stroke-width="2"/>
    <rect x="100" y="10" width="50" height="15" rx="7.5" fill="#0f6b4b"/>
    <text x="125" y="21.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">SECRET</text>
    <text x="125" y="45" font-size="11" font-weight="600" fill="#0d5540" text-anchor="middle">klm-{KYMA_NAME}-runtime-watcher-client</text>
  </g>
  <!-- 8 RW-Secret (SKR) -->
  <g transform="translate(1638,156)" filter="url(#cardShadow)">
    <rect width="250" height="64" rx="10" fill="#e6f6f0" stroke="#1baf7a" stroke-width="2"/>
    <rect x="100" y="10" width="50" height="15" rx="7.5" fill="#0f6b4b"/>
    <text x="125" y="21.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">SECRET</text>
    <text x="125" y="45" font-size="12.5" font-weight="600" fill="#0d5540" text-anchor="middle">runtime-watcher-client</text>
  </g>
  <!-- 9 RW-Deploy (SKR) -->
  <g transform="translate(1638,312)" filter="url(#cardShadow)">
    <rect width="250" height="64" rx="10" fill="#ecebf7" stroke="#4a3aa7" stroke-width="2"/>
    <rect x="87.5" y="10" width="75" height="15" rx="7.5" fill="#4a3aa7"/>
    <text x="125" y="21.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">DEPLOYMENT</text>
    <text x="125" y="45" font-size="12.5" font-weight="600" fill="#2b2266" text-anchor="middle">runtime-watcher</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(48,428)" font-size="12" fill="#52514e">
    <rect x="0" y="-11" width="14" height="14" rx="3" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
    <text x="22" y="0">Issuer</text>
    <rect x="90" y="-11" width="14" height="14" rx="3" fill="#fdeee6" stroke="#eb6834" stroke-width="2"/>
    <text x="112" y="0">Certificate</text>
    <rect x="205" y="-11" width="14" height="14" rx="3" fill="#e6f6f0" stroke="#1baf7a" stroke-width="2"/>
    <text x="227" y="0">Secret</text>
    <rect x="295" y="-11" width="14" height="14" rx="3" fill="#ecebf7" stroke="#4a3aa7" stroke-width="2"/>
    <text x="317" y="0">Deployment</text>

    <path d="M430,-4 H460" stroke="#7c7a75" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="468" y="0">issues / stores</text>
    <path d="M585,-4 H615" stroke="#7c7a75" stroke-width="1.5" stroke-dasharray="1.5 3" marker-end="url(#arrow)"/>
    <text x="623" y="0">reads (reference)</text>
    <path d="M760,-4 H790" stroke="#4a3aa7" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowSync)"/>
    <text x="798" y="0" fill="#4a3aa7">sync across cluster (KCP &#8594; SKR)</text>
  </g>

  <!-- footnote -->
  <text x="48" y="462" font-size="10.5" font-weight="400" fill="#898781">The KCP-side Issuers, Certificate, and CA Secret live in the istio-system namespace; a name shared across kinds is the same logical object in different forms (disambiguated by the kind tag).</text>
</svg>

# Helm value overlay for the oci-reg-cred-secret e2e test.
# The chart does not enforce oci-registry-host / oci-registry-cred-secret mutual
# exclusivity, and values-local.yaml sets ociRegistryHost. Null it out here so
# only --oci-registry-cred-secret is passed (the binary requires exactly one).
manager:
  ociRegistryHost: null
  ociRegistryCredentialSecretName: private-oci-reg-creds

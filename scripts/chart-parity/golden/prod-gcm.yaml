# Source: lifecycle-manager/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klm-controller-manager
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
    reloader.stakater.com/auto: "true"
  labels:
    helm.sh/chart: lifecycle-manager-2.26.0
    app.kubernetes.io/component: lifecycle-manager.kyma-project.io
    app.kubernetes.io/name: kcp-lifecycle-manager
    app.kubernetes.io/instance: kcp-lifecycle-manager
    app.kubernetes.io/version: "1.20.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kcp-dev
  namespace: kcp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: lifecycle-manager.kyma-project.io
      app.kubernetes.io/name: kcp-lifecycle-manager
      app.kubernetes.io/instance: kcp-lifecycle-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        traffic.sidecar.istio.io/excludeInboundPorts: "9443"
      labels:
        helm.sh/chart: lifecycle-manager-2.26.0
        app.kubernetes.io/component: lifecycle-manager.kyma-project.io
        app.kubernetes.io/name: kcp-lifecycle-manager
        app.kubernetes.io/instance: kcp-lifecycle-manager
        app.kubernetes.io/version: "1.20.4"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: kcp-dev
    spec:
      serviceAccountName: klm-controller-manager
      securityContext:
        runAsNonRoot: true
      containers:
        - name: "manager"
          command:
            - /manager
          env:
          args:
            - --leader-elect
            - --skr-watcher-image-name=runtime-watcher
            - --skr-watcher-image-tag=2.1.13
            - --skr-watcher-image-registry=europe-docker.pkg.dev/kyma-project/prod
            - --watcher-requeue-success-interval=1m
            - --enable-webhooks=true
            - --rate-limiter-burst=2000
            - --rate-limiter-frequency=1000
            - --k8s-client-qps=1000
            - --k8s-client-burst=2000
            - --cache-sync-timeout=60m
            - --failure-max-delay=30s
            - --failure-base-delay=5s
            - --kyma-requeue-success-interval=5m
            - --manifest-requeue-success-interval=5m
            - --mandatory-module-requeue-success-interval=2m
            - --kyma-requeue-warning-interval=30s
            - --kyma-requeue-error-interval=2s
            - --kyma-requeue-busy-interval=5s
            - --max-concurrent-manifest-reconciles=75
            - --max-concurrent-kyma-reconciles=25
            - --skip-finalizer-purging-for=*.crd.projectcalico.org,*.cert.gardener.cloud,*.dns.gardener.cloud,*.autoscaling.k8s.io,*.snapshot.storage.k8s.io
            - --drop-crd-stored-version-map=Manifest:v1beta1,Watcher:v1beta1,ModuleTemplate:v1beta1,Kyma:v1beta1
            - --cert-management=cert.gardener.cloud/v1alpha1
            - --self-signed-cert-duration=1440h
          securityContext:
            allowPrivilegeEscalation: false
          image: europe-docker.pkg.dev/kyma-project/prod/lifecycle-manager:1.20.4
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
            - containerPort: 8082
              name: listener
            - containerPort: 8080
              name: metrics
          resources:
            {}
          volumeMounts:
            - name: maintenance-policy
              mountPath: /etc/maintenance-policy
              readOnly: true
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
      volumes:
        - name: maintenance-policy
          configMap:
            name: maintenance-policy-config
            optional: true
            items:
              - key: general-maintenance-windows.json
                path: policy.json
        - name: cert
          secret:
            defaultMode: 420
            secretName: klm-controller-manager-webhook

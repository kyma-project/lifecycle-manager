name: Build Image (Local testing / ghcr.io)

# Builds lifecycle-manager multi-platform images for local testing.
# The image is exported as an OCI tarball and uploaded as an artifact.
# A separate workflow (publish-image-local.yml) pushes it to ghcr.io.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".reuse/**"
      - "LICENSES/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".reuse/**"
      - "LICENSES/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Additional image tag (e.g. v1.2.3 or my-feature)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (OCI tarball)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/image.tar
          build-args: |
            TAG_default_tag=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-oci
          path: /tmp/image.tar
          retention-days: 1
          if-no-files-found: error

name: Lint golangci

on:
  pull_request:
    branches:
      - main
      - feat/**
  workflow_dispatch:

permissions: { }

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lifecycle-manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lifecycle-manager
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: './lifecycle-manager/go.mod'
          cache: false
      - name: Get configuration
        uses: ./lifecycle-manager/.github/actions/get-configuration
        id: configuration
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.configuration.outputs.golangci_lint_version }}
          args: --verbose
          working-directory: ./lifecycle-manager
          skip-cache: true
          install-mode: binary
        env:
          GOSUMDB: sum.golang.org
      - name: golangci-lint for api module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.configuration.outputs.golangci_lint_version }}
          args: --verbose
          working-directory: ./lifecycle-manager/api
          skip-cache: true
          install-mode: binary
        env:
          GOSUMDB: sum.golang.org
      - name: golangci-lint for maintenancewindows module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.configuration.outputs.golangci_lint_version }}
          args: --verbose
          working-directory: ./lifecycle-manager/maintenancewindows
          skip-cache: true
          install-mode: binary
        env:
          GOSUMDB: sum.golang.org

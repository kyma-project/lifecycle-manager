argosap:
  enabled: false
  appname: "lifecycle-manager"
  relname: ~
  namespace: "argo"
  project: "kcp"
  valuesrepo: ~
  valuesref: "main"
  valuesfile: ~
  repourl: "https://common.repositories.cloud.sap/artifactory/kyma-sre-helm/"
  generator: false
  # The chart version
  version: ~
  # defaults to .Chart.Name
  chart: ~
  syncPolicy:
    prune: false
    selfHeal: true
  syncOptions:
    applyOutOfSyncOnly: true
    validate: false
  deploymentnamespace: kcp-system

testing:
  enabled: true
  timeout: 300
  functional:
    enabled: false
    workflowName: ~
    entrypoint: main
    roleBindings: ~
  serviceTests:
    enabled: true

monitoring:
  dashboard_prefix: "dashboard"
  # label for plutono dashboard
  label_name: grafana_dashboard
  label_value: "1"
  # addition labels for plutono dashboard
  additionalLabels: ~
  vmscrapes:
    enabled: true
  enabled: false
  namespace: "kcp-system"
  performance:
    enabled: false
  prometheus:
    enabled: false

crds:
  enabled: true
  annotations: {}

manager:
  name: manager
  command: /manager
  loglevel: ~
  leaderElect:
    enabled: true
  pprof:
    enabled: false
  purgeFinalizer:
    skipFor:
      - "*.crd.projectcalico.org"
      - "*.cert.gardener.cloud"
      - "*.dns.gardener.cloud"
      - "*.autoscaling.k8s.io"
      - "*.snapshot.storage.k8s.io"
    additionalSkipFor: []
  ratelimiter:
    burst: 2000
    frequency: 1000
  kubeclient:
    qps: 1000
    burst: 2000
  cache:
    syncTimeout: 60m
  failure:
    baseDelay: 5s
    maxDelay: 30s
  moduleUpgradeRollout:
    maxDelay: ~
  requeue:
    success:
      kyma: 5m
      manifest: 5m
      mandatoryModuleInstall: 2m
      watcher: 1m
    warning:
      kyma: 30s
    error:
      kyma: 2s
    busy:
      kyma: 5s
  reconciles:
    concurrency:
      kyma: 25
      manifest: 75
  dropStoredVersion:
    enabled: true
    crdversions:
      - Manifest:v1beta1
      - Watcher:v1beta1
      - ModuleTemplate:v1beta1
      - Kyma:v1beta1
  ociRegistryHost: ~
  ociRegistryCredentialSecretName: ~
  selfSignedCertDuration: 1440h # 60d
  certificateSubjectDN:
    organizationalUnit: "BTP Kyma Runtime"
    organization: "SAP SE"
    locality: "Walldorf"
    province: "Baden-Württemberg"
    country: "DE"
  restrictedDefaultModules: []

watcher:
  labels:
    operator.kyma-project.io/watcher-gateway: default
  port: 443
  imageTag: 2.1.13
  imageName: runtime-watcher
  imageRegistry: europe-docker.pkg.dev/kyma-project/prod
  commonName: "watcher-selfsigned-ca"
  gatewayCredentialName: klm-istio-gateway
  fullnameOverride: watcher
  rootIssuerNameOverride: ~
  issuerNameOverride: ~
  certNameOverride: ~
  secretNameOverride: ~
  gatewayNameOverride: ~
  shortname: listener
  additionalDnsNames: ~
  watchedByLabelValue: kyma
  caCertDuration: 2160h # 90d

webhook:
  enabled: true
  issuerNameOverride: ~
  certNameOverride: ~
  secretNameOverride: ~

replicaCount: 1

image:
  repository: europe-docker.pkg.dev/kyma-project/prod/lifecycle-manager
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ~

imagePullSecrets: []
prefix: klm
nameOverride: "kcp-lifecycle-manager"
fullnameOverride: "controller-manager"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  gcp:
    iamName: ~

deploymentAnnotations:
  argocd.argoproj.io/sync-options: Replace=true
  reloader.stakater.com/auto: "true"

podAnnotations:
  kubectl.kubernetes.io/default-container: manager
  traffic.sidecar.istio.io/excludeInboundPorts: "9443"
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  webhook:
    port: 9443
    # will be updated once custom names are supported: https://github.com/kyma-project/lifecycle-manager/issues/1744
    nameOverride: webhook-service
  listener:
    port: 8082
    nameOverride: ~
  metrics:
    port: 8080
    nameOverride: ~
  health:
    port: 8081
  kmm:
    enabled: true
    name: kmm
    port: 8083

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

global:
  networkPolicies:
    enabled: false
  istio:
    ambient:
      enabled: false

skrImagePullSecret:
  name: ~
